<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Microsite Factory — research-grade personalized microsites, at volume">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1600" height="400" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1599" height="399" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- wordmark -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="88" y="118" font-size="17" letter-spacing="4.5" fill="#7fb0ff" font-weight="600">GX HERMES BUILDATHON · AI AS AGENCY</text>
    <text x="86" y="196" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">Microsite Factory</text>
    <text x="88" y="248" font-size="27" fill="#c9d4e6" font-weight="500">Research-grade personalized microsites, at volume.</text>
    <text x="88" y="300" font-size="16" fill="#8593ab" font-family="'IBM Plex Mono', 'JetBrains Mono', Menlo, Consolas, monospace">one autonomous agency per account  ·  QA gate on every stage  ·  eval trace behind every decision</text>
  </g>

  <!-- pipeline glyph -->
  <g transform="translate(1010,150)">
    <!-- rail -->
    <line x1="0" y1="50" x2="500" y2="50" stroke="#2b3a57" stroke-width="3"/>
    <line x1="0" y1="50" x2="500" y2="50" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 10" stroke-opacity="0.6"/>

    <!-- stage nodes -->
    <g font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2" text-anchor="middle" fill="#a9b7d0">
      <g>
        <circle cx="30" cy="50" r="26" fill="#0f1a2e" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="30" cy="50" r="26" fill="#3b82f6" fill-opacity="0.35" filter="url(#soft)"/>
        <text x="30" y="55" fill="#ffffff" font-weight="700" font-size="14">R</text>
        <text x="30" y="110">RESEARCH</text>
      </g>
      <g>
        <circle cx="250" cy="50" r="26" fill="#0f1a2e" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="250" cy="50" r="26" fill="#3b82f6" fill-opacity="0.35" filter="url(#soft)"/>
        <text x="250" y="55" fill="#ffffff" font-weight="700" font-size="14">B</text>
        <text x="250" y="110">BUILD</text>
      </g>
      <g>
        <circle cx="470" cy="50" r="26" fill="#0f1a2e" stroke="#22c55e" stroke-width="3"/>
        <circle cx="470" cy="50" r="26" fill="#22c55e" fill-opacity="0.35" filter="url(#soft)"/>
        <text x="470" y="55" fill="#ffffff" font-weight="700" font-size="14">D</text>
        <text x="470" y="110">DEPLOY</text>
      </g>
      <!-- QA gates (diamonds) -->
      <g fill="#0f1a2e" stroke="#22c55e" stroke-width="3">
        <rect x="126" y="36" width="28" height="28" rx="4" transform="rotate(45 140 50)"/>
        <rect x="346" y="36" width="28" height="28" rx="4" transform="rotate(45 360 50)"/>
      </g>
      <text x="140" y="-4" fill="#22c55e" font-size="12">QA</text>
      <text x="360" y="-4" fill="#22c55e" font-size="12">QA</text>
      <!-- trace ticks under gates -->
      <g stroke="#22c55e" stroke-opacity="0.7" stroke-width="2">
        <line x1="140" y1="76" x2="140" y2="90"/>
        <line x1="360" y1="76" x2="360" y2="90"/>
      </g>
      <text x="140" y="110" fill="#6b7a95" font-size="11">trace</text>
      <text x="360" y="110" fill="#6b7a95" font-size="11">trace</text>
    </g>
  </g>
</svg>
